name: GitHub sync

# Calls the deployed /api/cron/github-sync every 6 hours. Needs two Actions secrets,
# added once the site is live on Vercel: SITE_URL (e.g. https://example.com) and
# CRON_SECRET (same value as the Vercel env var). Without them the job logs a notice
# and exits successfully, so it is safe before deploy.

on:
  schedule:
    - cron: "17 */6 * * *" # 00:17, 06:17, 12:17, 18:17 UTC (07:17, 13:17, 19:17, 01:17 UTC+7)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only check configuration; don't call the site"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: github-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Trigger sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron/github-sync
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::SITE_URL or CRON_SECRET is not set as an Actions secret; skipping the sync call."
            exit 0
          fi
          url="${SITE_URL%/}/api/cron/github-sync"
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: secrets are set; would POST to $url"
            exit 0
          fi
          status=$(curl -sS -o response.json -w '%{http_code}' --max-time 90 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" "$url")
          cat response.json; echo
          if [ "$status" != "200" ]; then
            echo "::error::Sync returned HTTP $status"
            exit 1
          fi
