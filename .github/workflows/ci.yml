name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, check, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint + Prettier)
        run: pnpm lint

      - name: Type check (astro check)
        run: pnpm check

      - name: Build
        run: pnpm build

  chat-worker:
    name: Chat Worker (typecheck, corpus, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Runs in workerd via @cloudflare/vitest-plugin. Workers AI, Vectorize, Turnstile and the
    # site APIs are mocked, so no Cloudflare account or secret is needed.
    defaults:
      run:
        working-directory: workers/chat
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: workers/chat/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck && pnpm exec tsc --noEmit -p scripts

      - name: data/site.json matches the site content
        run: |
          pnpm corpus
          git status --porcelain data
          test -z "$(git status --porcelain data)"

      - name: Tests (vitest, workerd)
        run: pnpm test

  db:
    name: Migrations + DB tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Throwaway Postgres with pgvector inside the runner; no real DB secret needed.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: portfo
          POSTGRES_PASSWORD: portfo
          POSTGRES_DB: portfo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://portfo:portfo@localhost:5432/portfo
      TEST_DATABASE_URL: postgresql://portfo:portfo@localhost:5432/portfo_test
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrations match the schema
        run: |
          pnpm db:generate
          git status --porcelain drizzle
          test -z "$(git status --porcelain drizzle)"

      - name: Apply migrations (pnpm db:migrate)
        run: pnpm db:migrate

      - name: Create the test database
        run: psql "$DATABASE_URL" -c "CREATE DATABASE portfo_test"

      - name: Unit tests (vitest)
        run: pnpm test
