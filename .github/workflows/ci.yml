name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, check, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint + Prettier)
        run: pnpm lint

      - name: Type check (astro check)
        run: pnpm check

      - name: Unit tests (vitest, no database)
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: Chat window (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The built static site with the chat's mock stream (PUBLIC_USE_MOCKS defaults on):
    # no Worker or secret is needed.
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Playwright (desktop 1440 + mobile 390)
        run: pnpm test:e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  worker:
    name: Worker (typecheck, corpus, work.json, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Runs in workerd via @cloudflare/vitest-plugin against local D1, the Quota Durable
    # Object and the rate-limit binding. Workers AI is mocked, so no Cloudflare account
    # or secret is needed.
    defaults:
      run:
        working-directory: workers/portfo
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: workers/portfo/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck && pnpm exec tsc --noEmit -p scripts

      - name: Deploy guard (no REPLACE_ME in the top-level wrangler.jsonc config)
        run: pnpm check:config

      - name: data/site.json matches the site content
        run: |
          pnpm corpus
          git status --porcelain data
          test -z "$(git status --porcelain data)"

      - name: data/work.json matches the case studies
        run: |
          pnpm work
          git status --porcelain data
          test -z "$(git status --porcelain data)"

      - name: Tests (vitest, workerd + D1)
        run: pnpm test
