name: Chat ingest

# Re-embeds the CV and case studies into the chat Worker's Vectorize index after content
# changes on main. Needs two Actions secrets, added once portfo-chat is deployed:
# CHAT_URL (e.g. https://portfo-chat.<account>.workers.dev) and CHAT_INGEST_SECRET (the
# Worker's INGEST_SECRET). Without them the job logs a notice and exits successfully.

on:
  push:
    branches: [main]
    paths:
      - "src/content/work/**"
      - "src/data/**"
      - "src/lib/site.ts"
      - "workers/chat/data/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-ingest
  cancel-in-progress: false

jobs:
  ingest:
    name: POST /ingest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Send the corpus
        working-directory: workers/chat
        env:
          CHAT_URL: ${{ secrets.CHAT_URL }}
          INGEST_SECRET: ${{ secrets.CHAT_INGEST_SECRET }}
        run: |
          node scripts/ingest.ts --dry-run
          if [ -z "$CHAT_URL" ] || [ -z "$INGEST_SECRET" ]; then
            echo "::notice::CHAT_URL or CHAT_INGEST_SECRET is not set as an Actions secret; skipping ingest."
            exit 0
          fi
          node scripts/ingest.ts
